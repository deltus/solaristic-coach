# On every push to main or a round* branch: lint, typecheck and test that branch, then build one combined site and
# publish it to GitHub Pages: main (the live app) at the root, and each round* branch under preview/<branch>/.
# If any of those checks fail, nothing is published, so the site stays exactly as it was.
# Only the app code is published; player data never leaves each coach's device.
# Previews are built with VITE_PREVIEW=<branch>: their own database and storage keys and no service worker
# (see src/preview.ts). Copied from Solaristic Radar and trimmed (no Supabase yet).
name: Test and publish

on:
  push:
    branches: [main, 'round*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint, typecheck and test the pushed branch
        working-directory: repo
        run: |
          npm ci
          npm run lint:install
          npm run lint
          npm run typecheck
          npm test

      - name: Build the live app (main) at the root
        run: |
          mkdir -p site
          # Before the first merge, main has no app yet: publish a short holding page instead.
          if ! git -C repo cat-file -e origin/main:package.json 2>/dev/null; then
            printf '%s\n' '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' \
              '<title>Solaristic Coach</title><body style="font:16px/1.5 system-ui,sans-serif;padding:16px;background:#F4F0E8;color:#0E1A3A">' \
              '<h1>Solaristic Coach</h1><p>Coming soon. <a href="./preview/">Previews</a></p></body>' > site/index.html
            exit 0
          fi
          git -C repo worktree add -q --detach "$PWD/w/main" origin/main
          cd w/main
          npm ci
          npm run build
          cp -r dist/. ../../site/

      - name: Build each round* branch into preview/<branch>/
        run: |
          mkdir -p site/preview
          rows=""
          for b in $(git -C repo for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/round*'); do
            # The page shows each time in the viewer's own time zone (a small script below); UTC is only the fallback.
            iso=$(git -C repo log -1 --format=%cI "origin/$b")
            when="<time datetime=\"$iso\">$(TZ=UTC git -C repo log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M UTC' "origin/$b")</time>"
            dir="$PWD/w/$b"
            git -C repo worktree add -q --detach "$dir" "origin/$b"
            # Only branches with the preview safety (own database, no service worker) are published.
            if [ ! -f "$dir/src/preview.ts" ] || ! grep -q VITE_PREVIEW "$dir/vite.config.ts"; then
              echo "::warning::$b skipped: it doesn't have the preview safety code"
              rows="$rows<li><b>$b</b> · not published (no preview safety code) · updated $when</li>"
              continue
            fi
            if (cd "$dir" && npm ci && VITE_PREVIEW="$b" npm run build); then
              mkdir -p "site/preview/$b"
              cp -r "$dir/dist/." "site/preview/$b/"
              rows="$rows<li><a href=\"./$b/\">$b</a> · updated $when</li>"
            else
              echo "::warning::$b failed to build and was not published"
              rows="$rows<li><b>$b</b> · build failed, not published · updated $when</li>"
            fi
          done
          cat > site/preview/index.html <<EOF
          <!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Solaristic Coach previews</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;margin:0 auto;max-width:640px;padding:16px;background:#F4F0E8;color:#0E1A3A}li{margin:8px 0}a{color:#0E1A3A;font-weight:600}</style>
          </head><body><h1>Previews</h1>
          <p>Test copies of each round. Each has its own data on your phone. <a href="../">Live app</a></p>
          <ul>${rows:-<li>No previews yet.</li>}</ul>
          <p><small>Published <time datetime="$(date -u '+%Y-%m-%dT%H:%M:%SZ')">$(date -u '+%Y-%m-%d %H:%M UTC')</time> from ${GITHUB_REF_NAME}. Times are in your time zone.</small></p>
          <script>document.querySelectorAll('time[datetime]').forEach(function(t){var d=new Date(t.getAttribute('datetime'));if(!isNaN(d))t.textContent=d.toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});});</script>
          </body></html>
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
